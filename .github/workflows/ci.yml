name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: test
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dev
  DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/streamyst_test
  JWT_SECRET: ci-only-secret-not-used-anywhere-real
  API_BASE_URL: http://localhost:8100
  CORS_ORIGINS: http://localhost:3100
  COOKIE_SECURE: "false"
  COOKIE_SAME_SITE: lax
  NEXT_PUBLIC_APP_URL: http://localhost:3100
  NEXT_PUBLIC_API_URL: http://localhost:8100/trpc
  API_URL: http://localhost:8100/trpc
  LOGGER_LEVEL: error

jobs:
  verify:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The databases have to exist before migrations run, and `dotenv` is how every
      # package reads its configuration, so the file is written rather than exported. The
      # test database is created explicitly: the suite clones it per file, so it has to be
      # there before the first test rather than being created by it.
      - name: Prepare databases
        run: |
          cp .env.example .env
          sed -i "s|^JWT_SECRET=.*|JWT_SECRET=$JWT_SECRET|" .env
          pnpm db:create
          pnpm db:migrate

      - name: Lint
        run: pnpm lint

      - name: Check types
        run: pnpm check-types

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  e2e:
    name: End-to-end journeys
    runs-on: ubuntu-latest
    needs: verify

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: Prepare databases
        run: |
          cp .env.example .env
          sed -i "s|^JWT_SECRET=.*|JWT_SECRET=$JWT_SECRET|" .env
          pnpm db:create
          pnpm db:migrate

      # The journeys drive the real API and the real web app in a browser, so they are the
      # only check that covers the cookie being forwarded, the autosave debounce landing,
      # and the publish gate refusing a form that is not fillable.
      - name: Playwright
        run: pnpm --filter web e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
